<svg xmlns="http://www.w3.org/2000/svg" width="680" height="870" viewBox="0 0 680 870" role="img">
<title>Add-on pass workflow</title>
<desc>01 Local Setup, then 02 UX Review, then 03 Code Review. Code Review offers 04 Diagnostics Review and 06 Copy Review side by side. 04 leads to the optional 05 Data Review after an in-game test; 06 leads to 07 Localization Review. Both branches meet at 08 Prelaunch Review, which on Ready to tag offers 09, 10 and 11, then 12 Release Notes and PR.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.th{font-size:14px;font-weight:600}.ts{font-size:12px}
.g rect{fill:#F1EFE8;stroke:#5F5E5A}.g .th{fill:#444441}.g .ts{fill:#5F5E5A}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .th{fill:#3C3489}.p .ts{fill:#534AB7}
.t rect{fill:#E1F5EE;stroke:#0F6E56}.t .th{fill:#085041}.t .ts{fill:#0F6E56}
.arr{fill:none;stroke:#888780;stroke-width:1.5}.note{fill:#5F5E5A}
rect{stroke-width:1}
@media (prefers-color-scheme:dark){
.g rect{fill:#444441;stroke:#B4B2A9}.g .th{fill:#D3D1C7}.g .ts{fill:#B4B2A9}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .th{fill:#CECBF6}.p .ts{fill:#AFA9EC}
.t rect{fill:#085041;stroke:#5DCAA5}.t .th{fill:#9FE1CB}.t .ts{fill:#5DCAA5}
.note{fill:#B4B2A9}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="g"><rect x="240" y="40" width="200" height="56" rx="8"/><text class="th" x="340" y="58">01 Local Setup</text><text class="ts" x="340" y="78">Session Prep, once</text></g>
<line x1="340" y1="98" x2="340" y2="128" class="arr" marker-end="url(#a)"/>
<g class="p"><rect x="240" y="130" width="200" height="56" rx="8"/><text class="th" x="340" y="148">02 UX Review</text><text class="ts" x="340" y="168">Wireframes, research</text></g>
<line x1="340" y1="188" x2="340" y2="218" class="arr" marker-end="url(#a)"/>
<g class="p"><rect x="240" y="220" width="200" height="56" rx="8"/><text class="th" x="340" y="238">03 Code Review</text><text class="ts" x="340" y="258">Offers 04 and 06</text></g>
<path d="M340 278 L340 302 L190 302 L190 328" class="arr" marker-end="url(#a)"/>
<path d="M340 302 L490 302 L490 328" class="arr" marker-end="url(#a)"/>
<g class="p"><rect x="90" y="330" width="200" height="56" rx="8"/><text class="th" x="190" y="348">04 Diagnostics Review</text><text class="ts" x="190" y="368">Panel matches the code</text></g>
<text class="ts note" x="340" y="358">side by side</text>
<g class="p"><rect x="390" y="330" width="200" height="56" rx="8"/><text class="th" x="490" y="348">06 Copy Review</text><text class="ts" x="490" y="368">Polish enUS.lua</text></g>
<line x1="190" y1="388" x2="190" y2="438" class="arr" stroke-dasharray="4 4" marker-end="url(#a)"/>
<line x1="490" y1="388" x2="490" y2="438" class="arr" marker-end="url(#a)"/>
<g class="p"><rect x="90" y="440" width="200" height="56" rx="8" stroke-dasharray="4 4"/><text class="th" x="190" y="458">05 Data Review</text><text class="ts" x="190" y="478">Optional, after in-game test</text></g>
<g class="p"><rect x="390" y="440" width="200" height="56" rx="8"/><text class="th" x="490" y="458">07 Localization Review</text><text class="ts" x="490" y="478">Translate the changes</text></g>
<path d="M190 498 L190 522 L340 522" class="arr" stroke-dasharray="4 4"/>
<path d="M490 498 L490 522 L340 522 L340 548" class="arr" marker-end="url(#a)"/>
<g class="p"><rect x="240" y="550" width="200" height="56" rx="8"/><text class="th" x="340" y="568">08 Prelaunch Review</text><text class="ts" x="340" y="588">After both branches</text></g>
<path d="M340 608 L340 632 L145 632 L145 658" class="arr" marker-end="url(#a)"/>
<line x1="340" y1="632" x2="340" y2="658" class="arr" marker-end="url(#a)"/>
<path d="M340 632 L535 632 L535 658" class="arr" marker-end="url(#a)"/>
<g class="t"><rect x="60" y="660" width="170" height="56" rx="8"/><text class="th" x="145" y="678">09 README</text><text class="ts" x="145" y="698">Ready to tag only</text></g>
<g class="t"><rect x="255" y="660" width="170" height="56" rx="8"/><text class="th" x="340" y="678">10 Technical</text><text class="ts" x="340" y="698">README-Technical</text></g>
<g class="t"><rect x="450" y="660" width="170" height="56" rx="8"/><text class="th" x="535" y="678">11 Testing</text><text class="ts" x="535" y="698">README-Testing</text></g>
<path d="M145 718 L145 744 L340 744" class="arr"/>
<path d="M535 718 L535 744 L340 744" class="arr"/>
<line x1="340" y1="718" x2="340" y2="768" class="arr" marker-end="url(#a)"/>
<g class="t"><rect x="230" y="770" width="220" height="56" rx="8"/><text class="th" x="340" y="788">12 Release Notes &amp; PR</text><text class="ts" x="340" y="808">Once 09–11 finish</text></g>
<text class="ts note" x="340" y="852">Purple: review passes · Teal: docs and release · Dashed: optional</text>
</svg>
