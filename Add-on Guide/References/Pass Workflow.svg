<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1220" viewBox="0 0 680 1220" role="img">
<title>Add-on pass workflow</title>
<desc>Optional 00 GitHub Cleanup, then 01 Local Setup, then three optional jobs side by side (Paste In GitHub Issues, Address Reported Defects, Create New Features), then Preliminary Manual Testing, iterating until it is right, then 02 UX Review and 03 Code Review. Then two branches side by side: 04 Diagnostics Review then the optional 05 Data Review, beside 06 Copy Review then 07 Localization Review. They meet at Final Manual Testing, iterating until it is right. Then 08 Prelaunch Review. Not ready means fix and run 08 again; Ready to tag offers 09, 10 and 11, then 12 Release Notes and PR, then 13 Post Merge Sanity Check once the PR is merged.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.th{font-size:14px;font-weight:600}.ts{font-size:12px}
.g rect{fill:#F1EFE8;stroke:#5F5E5A}.g .th{fill:#444441}.g .ts{fill:#5F5E5A}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .th{fill:#3C3489}.p .ts{fill:#534AB7}
.t rect{fill:#E1F5EE;stroke:#0F6E56}.t .th{fill:#085041}.t .ts{fill:#0F6E56}
.a rect{fill:#FAEEDA;stroke:#854F0B}.a .th{fill:#633806}.a .ts{fill:#854F0B}
.arr{fill:none;stroke:#888780;stroke-width:1.5}.d{stroke-dasharray:4 4}.note{fill:#5F5E5A}
rect{stroke-width:1}
@media (prefers-color-scheme:dark){
.g rect{fill:#444441;stroke:#B4B2A9}.g .th{fill:#D3D1C7}.g .ts{fill:#B4B2A9}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .th{fill:#CECBF6}.p .ts{fill:#AFA9EC}
.t rect{fill:#085041;stroke:#5DCAA5}.t .th{fill:#9FE1CB}.t .ts{fill:#5DCAA5}
.a rect{fill:#633806;stroke:#EF9F27}.a .th{fill:#FAC775}.a .ts{fill:#EF9F27}
.note{fill:#B4B2A9}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="g"><rect x="240" y="24" width="200" height="52" rx="8" class="d"/><text class="th" x="340" y="41">00 GitHub Cleanup</text><text class="ts" x="340" y="60">Optional</text></g>
<line x1="340" y1="78" x2="340" y2="102" class="arr d" marker-end="url(#a)"/>
<g class="g"><rect x="240" y="104" width="200" height="52" rx="8"/><text class="th" x="340" y="121">01 Local Setup</text><text class="ts" x="340" y="140">Session Prep</text></g>
<path d="M340 158 L340 174 L120 174 L120 192" class="arr d" marker-end="url(#a)"/>
<line x1="340" y1="174" x2="340" y2="192" class="arr d" marker-end="url(#a)"/>
<path d="M340 174 L560 174 L560 192" class="arr d" marker-end="url(#a)"/>
<g class="g"><rect x="25" y="194" width="190" height="52" rx="8" class="d"/><text class="th" x="120" y="211">Paste In GitHub Issues</text><text class="ts" x="120" y="230">Optional</text></g>
<g class="g"><rect x="245" y="194" width="190" height="52" rx="8" class="d"/><text class="th" x="340" y="211">Address Reported Defects</text><text class="ts" x="340" y="230">Optional</text></g>
<g class="g"><rect x="465" y="194" width="190" height="52" rx="8" class="d"/><text class="th" x="560" y="211">Create New Features</text><text class="ts" x="560" y="230">Optional</text></g>
<path d="M120 248 L120 268 L340 268" class="arr d"/>
<path d="M560 248 L560 268 L340 268" class="arr d"/>
<line x1="340" y1="248" x2="340" y2="290" class="arr" marker-end="url(#a)"/>
<g class="a"><rect x="230" y="292" width="220" height="52" rx="8"/><text class="th" x="340" y="309">Preliminary Manual Testing</text><text class="ts" x="340" y="328">Before 02</text></g>
<line x1="452" y1="306" x2="518" y2="306" class="arr" marker-end="url(#a)"/>
<text class="ts note" x="485" y="293">Needs work</text>
<line x1="520" y1="330" x2="454" y2="330" class="arr" marker-end="url(#a)"/>
<text class="ts note" x="485" y="344">re-test</text>
<g class="g"><rect x="520" y="292" width="140" height="52" rx="8"/><text class="th" x="590" y="309">Iterate</text><text class="ts" x="590" y="328">Make changes</text></g>
<line x1="340" y1="346" x2="340" y2="370" class="arr" marker-end="url(#a)"/>
<g class="p"><rect x="240" y="372" width="200" height="52" rx="8"/><text class="th" x="340" y="389">02 UX Review</text><text class="ts" x="340" y="408">Wireframes</text></g>
<line x1="340" y1="426" x2="340" y2="450" class="arr" marker-end="url(#a)"/>
<g class="p"><rect x="240" y="452" width="200" height="52" rx="8"/><text class="th" x="340" y="469">03 Code Review</text><text class="ts" x="340" y="488">Offers 04 and 06</text></g>

<path d="M340 506 L340 522 L190 522 L190 542" class="arr" marker-end="url(#a)"/>
<path d="M340 522 L490 522 L490 542" class="arr" marker-end="url(#a)"/>
<g class="p"><rect x="90" y="544" width="200" height="52" rx="8"/><text class="th" x="190" y="561">04 Diagnostics Review</text><text class="ts" x="190" y="580">Panel matches the code</text></g>
<text class="ts note" x="340" y="570">side by side</text>
<g class="p"><rect x="390" y="544" width="200" height="52" rx="8"/><text class="th" x="490" y="561">06 Copy Review</text><text class="ts" x="490" y="580">Polish enUS.lua</text></g>
<line x1="190" y1="598" x2="190" y2="634" class="arr d" marker-end="url(#a)"/>
<line x1="490" y1="598" x2="490" y2="634" class="arr" marker-end="url(#a)"/>
<g class="p"><rect x="90" y="636" width="200" height="52" rx="8" class="d"/><text class="th" x="190" y="653">05 Data Review</text><text class="ts" x="190" y="672">Optional</text></g>
<g class="p"><rect x="390" y="636" width="200" height="52" rx="8"/><text class="th" x="490" y="653">07 Localization Review</text><text class="ts" x="490" y="672">Translate the changes</text></g>
<path d="M190 690 L190 712 L340 712" class="arr d"/>
<path d="M490 690 L490 712 L340 712 L340 734" class="arr" marker-end="url(#a)"/>

<g class="a"><rect x="230" y="736" width="220" height="52" rx="8"/><text class="th" x="340" y="753">Final Manual Testing</text><text class="ts" x="340" y="772">After 07 and 05</text></g>
<line x1="452" y1="750" x2="518" y2="750" class="arr" marker-end="url(#a)"/>
<text class="ts note" x="485" y="737">Needs work</text>
<line x1="520" y1="774" x2="454" y2="774" class="arr" marker-end="url(#a)"/>
<text class="ts note" x="485" y="788">re-test</text>
<g class="g"><rect x="520" y="736" width="140" height="52" rx="8"/><text class="th" x="590" y="753">Iterate</text><text class="ts" x="590" y="772">Make changes</text></g>
<line x1="340" y1="790" x2="340" y2="826" class="arr" marker-end="url(#a)"/>

<g class="p"><rect x="240" y="828" width="200" height="52" rx="8"/><text class="th" x="340" y="845">08 Prelaunch Review</text><text class="ts" x="340" y="864">Ready to tag?</text></g>
<line x1="238" y1="842" x2="162" y2="842" class="arr" marker-end="url(#a)"/>
<text class="ts note" x="200" y="829">Not ready</text>
<line x1="160" y1="866" x2="236" y2="866" class="arr" marker-end="url(#a)"/>
<text class="ts note" x="200" y="880">re-run 08</text>
<g class="g"><rect x="20" y="828" width="140" height="52" rx="8"/><text class="th" x="90" y="845">Fix</text><text class="ts" x="90" y="864">Run its fix prompts</text></g>

<path d="M340 882 L340 906 L145 906 L145 932" class="arr" marker-end="url(#a)"/>
<line x1="340" y1="906" x2="340" y2="932" class="arr" marker-end="url(#a)"/>
<path d="M340 906 L535 906 L535 932" class="arr" marker-end="url(#a)"/>
<text class="ts note" x="390" y="894">Ready to tag</text>
<g class="t"><rect x="60" y="934" width="170" height="52" rx="8"/><text class="th" x="145" y="951">09 README</text><text class="ts" x="145" y="970">Player README</text></g>
<g class="t"><rect x="255" y="934" width="170" height="52" rx="8"/><text class="th" x="340" y="951">10 Technical</text><text class="ts" x="340" y="970">README-Technical</text></g>
<g class="t"><rect x="450" y="934" width="170" height="52" rx="8"/><text class="th" x="535" y="951">11 Testing</text><text class="ts" x="535" y="970">README-Testing</text></g>
<path d="M145 988 L145 1010 L340 1010" class="arr"/>
<path d="M535 988 L535 1010 L340 1010" class="arr"/>
<line x1="340" y1="988" x2="340" y2="1034" class="arr" marker-end="url(#a)"/>
<g class="t"><rect x="230" y="1036" width="220" height="52" rx="8"/><text class="th" x="340" y="1053">12 Release Notes &amp; PR</text><text class="ts" x="340" y="1072">Once 09–11 finish</text></g>
<line x1="340" y1="1090" x2="340" y2="1114" class="arr" marker-end="url(#a)"/>
<g class="t"><rect x="230" y="1116" width="220" height="52" rx="8"/><text class="th" x="340" y="1133">13 Post Merge Check</text><text class="ts" x="340" y="1152">Once the PR is merged</text></g>

<text class="ts note" x="340" y="1198">Purple: reviews · Amber: manual testing · Teal: docs and release · Dashed: optional</text>
</svg>
