<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1044" viewBox="0 0 680 1044" role="img">
<title>Add-on pass workflow</title>
<desc>Optional 00 GitHub Cleanup, then 01 Local Setup, 02 UX Review and 03 Code Review. Then two branches side by side: 04 Diagnostics Review then the optional 05 Data Review, beside 06 Copy Review then 07 Localization Review. They meet at an in-game test; a bug found there goes to the Fix a Bug prompt and the test runs again. Then the optional Code Comment Cleanup, then 08 Prelaunch Review. Not ready means fix and run 08 again; Ready to tag offers 09, 10 and 11, then 12 Release Notes and PR.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.th{font-size:14px;font-weight:600}.ts{font-size:12px}
.g rect{fill:#F1EFE8;stroke:#5F5E5A}.g .th{fill:#444441}.g .ts{fill:#5F5E5A}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .th{fill:#3C3489}.p .ts{fill:#534AB7}
.t rect{fill:#E1F5EE;stroke:#0F6E56}.t .th{fill:#085041}.t .ts{fill:#0F6E56}
.a rect{fill:#FAEEDA;stroke:#854F0B}.a .th{fill:#633806}.a .ts{fill:#854F0B}
.arr{fill:none;stroke:#888780;stroke-width:1.5}.d{stroke-dasharray:4 4}.note{fill:#5F5E5A}
rect{stroke-width:1}
@media (prefers-color-scheme:dark){
.g rect{fill:#444441;stroke:#B4B2A9}.g .th{fill:#D3D1C7}.g .ts{fill:#B4B2A9}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .th{fill:#CECBF6}.p .ts{fill:#AFA9EC}
.t rect{fill:#085041;stroke:#5DCAA5}.t .th{fill:#9FE1CB}.t .ts{fill:#5DCAA5}
.a rect{fill:#633806;stroke:#EF9F27}.a .th{fill:#FAC775}.a .ts{fill:#EF9F27}
.note{fill:#B4B2A9}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="g"><rect x="240" y="24" width="200" height="52" rx="8" class="d"/><text class="th" x="340" y="41">00 GitHub Cleanup</text><text class="ts" x="340" y="60">Optional</text></g>
<line x1="340" y1="78" x2="340" y2="102" class="arr d" marker-end="url(#a)"/>
<g class="g"><rect x="240" y="104" width="200" height="52" rx="8"/><text class="th" x="340" y="121">01 Local Setup</text><text class="ts" x="340" y="140">Session Prep</text></g>
<line x1="340" y1="158" x2="340" y2="182" class="arr" marker-end="url(#a)"/>
<g class="p"><rect x="240" y="184" width="200" height="52" rx="8"/><text class="th" x="340" y="201">02 UX Review</text><text class="ts" x="340" y="220">Wireframes</text></g>
<line x1="340" y1="238" x2="340" y2="262" class="arr" marker-end="url(#a)"/>
<g class="p"><rect x="240" y="264" width="200" height="52" rx="8"/><text class="th" x="340" y="281">03 Code Review</text><text class="ts" x="340" y="300">Offers 04 and 06</text></g>

<path d="M340 318 L340 334 L190 334 L190 354" class="arr" marker-end="url(#a)"/>
<path d="M340 334 L490 334 L490 354" class="arr" marker-end="url(#a)"/>
<g class="p"><rect x="90" y="356" width="200" height="52" rx="8"/><text class="th" x="190" y="373">04 Diagnostics Review</text><text class="ts" x="190" y="392">Panel matches the code</text></g>
<text class="ts note" x="340" y="382">side by side</text>
<g class="p"><rect x="390" y="356" width="200" height="52" rx="8"/><text class="th" x="490" y="373">06 Copy Review</text><text class="ts" x="490" y="392">Polish enUS.lua</text></g>
<line x1="190" y1="410" x2="190" y2="446" class="arr d" marker-end="url(#a)"/>
<line x1="490" y1="410" x2="490" y2="446" class="arr" marker-end="url(#a)"/>
<g class="p"><rect x="90" y="448" width="200" height="52" rx="8" class="d"/><text class="th" x="190" y="465">05 Data Review</text><text class="ts" x="190" y="484">Optional</text></g>
<g class="p"><rect x="390" y="448" width="200" height="52" rx="8"/><text class="th" x="490" y="465">07 Localization Review</text><text class="ts" x="490" y="484">Translate the changes</text></g>
<path d="M190 502 L190 524 L340 524" class="arr d"/>
<path d="M490 502 L490 524 L340 524 L340 546" class="arr" marker-end="url(#a)"/>

<g class="a"><rect x="240" y="548" width="200" height="52" rx="8"/><text class="th" x="340" y="565">In-game Test</text><text class="ts" x="340" y="584">After 07 and 05</text></g>
<line x1="442" y1="562" x2="518" y2="562" class="arr" marker-end="url(#a)"/>
<text class="ts note" x="480" y="549">Found a bug</text>
<line x1="520" y1="586" x2="444" y2="586" class="arr" marker-end="url(#a)"/>
<text class="ts note" x="480" y="600">re-run</text>
<g class="g"><rect x="520" y="548" width="140" height="52" rx="8"/><text class="th" x="590" y="565">Fix a Bug</text><text class="ts" x="590" y="584">prompt</text></g>
<line x1="340" y1="602" x2="340" y2="638" class="arr" marker-end="url(#a)"/>
<g class="g"><rect x="240" y="640" width="200" height="52" rx="8" class="d"/><text class="th" x="340" y="657">Code Comment Cleanup</text><text class="ts" x="340" y="676">Optional</text></g>
<line x1="340" y1="694" x2="340" y2="730" class="arr" marker-end="url(#a)"/>

<g class="p"><rect x="240" y="732" width="200" height="52" rx="8"/><text class="th" x="340" y="749">08 Prelaunch Review</text><text class="ts" x="340" y="768">Ready to tag?</text></g>
<line x1="238" y1="746" x2="162" y2="746" class="arr" marker-end="url(#a)"/>
<text class="ts note" x="200" y="733">Not ready</text>
<line x1="160" y1="770" x2="236" y2="770" class="arr" marker-end="url(#a)"/>
<text class="ts note" x="200" y="784">re-run 08</text>
<g class="g"><rect x="20" y="732" width="140" height="52" rx="8"/><text class="th" x="90" y="749">Fix</text><text class="ts" x="90" y="768">Run its fix prompts</text></g>

<path d="M340 786 L340 810 L145 810 L145 836" class="arr" marker-end="url(#a)"/>
<line x1="340" y1="810" x2="340" y2="836" class="arr" marker-end="url(#a)"/>
<path d="M340 810 L535 810 L535 836" class="arr" marker-end="url(#a)"/>
<text class="ts note" x="390" y="798">Ready to tag</text>
<g class="t"><rect x="60" y="838" width="170" height="52" rx="8"/><text class="th" x="145" y="855">09 README</text><text class="ts" x="145" y="874">Player README</text></g>
<g class="t"><rect x="255" y="838" width="170" height="52" rx="8"/><text class="th" x="340" y="855">10 Technical</text><text class="ts" x="340" y="874">README-Technical</text></g>
<g class="t"><rect x="450" y="838" width="170" height="52" rx="8"/><text class="th" x="535" y="855">11 Testing</text><text class="ts" x="535" y="874">README-Testing</text></g>
<path d="M145 892 L145 914 L340 914" class="arr"/>
<path d="M535 892 L535 914 L340 914" class="arr"/>
<line x1="340" y1="892" x2="340" y2="938" class="arr" marker-end="url(#a)"/>
<g class="t"><rect x="230" y="940" width="220" height="52" rx="8"/><text class="th" x="340" y="957">12 Release Notes &amp; PR</text><text class="ts" x="340" y="976">Once 09–11 finish</text></g>

<text class="ts note" x="340" y="1022">Purple: reviews · Amber: you, in game · Teal: docs and release · Dashed: optional</text>
</svg>
